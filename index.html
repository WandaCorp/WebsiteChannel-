    <header class="header" id="header">
    <div class="header__left">
        <div class="header__avatar-container">
            <img 
                class="header__avatar-img" id="avatarIMG" 
                src="img/default-profile-channel.jpg" 
                alt="Avatar del canal Don Nadie"
                loading="lazy"
            >
        </div>
        <div class="header__info" id="headerInfo">
            <h1 class="header__channel-name" id="channelName"></h1>
            <!-- Datos de suscriptores se registrarán con Firebase Auth más adelante-->
            <span class="header__subscribers" id="subscribers"></span>
        </div>
    </div>

        <div class="header__pill">

            <button 
                class="header__pill-btn" 
                title="Más opciones"
                id="options-btn"
                aria-label="Más opciones"
                type="button"
            >

        </div>
    </div>
</header>

<main class="main-channel-container" id="mainChannelContainer">
    <section class="channel-feed" id="channelFeed" aria-label="Feed de publicaciones del canal"> 
        <!-- Se crearán más con Java script y datos de Firebase Firestore Database --> 
    </section>

    <div class="textarea-container">
        <div class="textarea-wrapper">
            <textarea
                class="textarea"
                id="textarea"
                placeholder="Escribe algo"
                aria-label="Enviar nuevo Post"
                rows="1"
            ></textarea>
        </div>
        <button
                class="send-button"
                id="sendButton"
                title="Enviar publicación"
                aria-label="Enviar publicación"
                type="button">
          <span class="material-symbols-oulined">arrow_upward</span>
        </button>
    </div>
  </main>

  <!-- ==================== SCRIPTS ==================== -->
  <!-- Orden de carga: Dependencias → Config → DOM → UI -->
  <!-- 1. Referencias del DOM (sin dependencias) -->
  <script type="module" src="js/script-basic.js"></script>
  <!-- 2. Configuración de Firebase Firestore (dependencia para UI) -->
  <script type="module" src="js/firebase-config.js"></script>
  <!-- Script de manejo de Logins -->
  <script type="module" src="js/login.js"></script>
  <!-- 3. UI principal (depende de script-basic.js y firebase-config.js) -->
  <script type="module" src="js/ui.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal web personalizado</title>
    <link rel="stylesheet" href="css/style.css" type="text/css" media="all" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Import Map: resuelve bare imports desde CDN -->
<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
      "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.esm.js",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.es.mjs"
    }
  }
</script>
    
  </head>
  <body>
    
    <header class="header" id="header">
    <div class="header__left">
        <div class="header__avatar-container">
            <img 
                class="header__avatar-img" id="avatarIMG" 
                src="https://i.postimg.cc/zX1nWKGr/default-profile-channel.jpg" 
                alt="Avatar del canal Don Nadie"
                loading="lazy"
            >
        </div>
        <div class="header__info" id="headerInfo">
            <h1 class="header__channel-name" id="channelName"></h1>
            <!-- Datos de suscriptores se registrarán con Firebase Auth más adelante-->
            <span class="header__subscribers" id="subscribers"></span>
        </div>
    </div>

    <div class="header__right">
        <div class="header__pill">
          <button class="header__pill-btn"
            id="aspect-theme" 
            title="Cambiar tema"
            aria-label="Cambiar tema claro/oscuro" 
            type="button">
              <svg class="header__pill-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
            <button 
                class="header__pill-btn" 
                id="share-channel" 
                title="Compartir canal"
                aria-label="Compartir canal"
                type="button"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 256 256"><path d="M237.66,106.35l-80-80A8,8,0,0,0,144,32V72.35c-25.94,2.22-54.59,14.92-78.16,34.91-28.38,24.08-46.05,55.11-49.76,87.37a12,12,0,0,0,20.68,9.58h0c11-11.71,50.14-48.74,107.24-52V192a8,8,0,0,0,13.66,5.65l80-80A8,8,0,0,0,237.66,106.35ZM160,172.69V144a8,8,0,0,0-8-8c-28.08,0-55.43,7.33-81.29,21.8a196.17,196.17,0,0,0-36.57,26.52c5.8-23.84,20.42-46.51,42.05-64.86C99.41,99.77,127.75,88,152,88a8,8,0,0,0,8-8V51.32L220.69,112Z"></path></svg>
                
            </button>
            <button 
                class="header__pill-btn" 
                title="Más opciones"
                id="options-btn"
                aria-label="Más opciones"
                type="button"
            >
              
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis-vertical-icon lucide-ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
        </div>
    </div>
</header>

<main class="main-channel-container" id="mainChannelContainer">
    <section class="channel-feed" id="channelFeed" aria-label="Feed de publicaciones del canal"> 
        <!-- Se crearán más con Java script y datos de Firebase Firestore Database --> 
    </section>

    <div class="textarea-container">
        <div class="textarea-wrapper">
            <textarea
                class="textarea"
                id="textarea"
                placeholder="Escribe algo"
                aria-label="Enviar nuevo Post"
                rows="1"
            ></textarea>
        </div>
        <button
                class="send-button"
                id="sendButton"
                title="Enviar publicación"
                aria-label="Enviar publicación"
                type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-horizontal-icon lucide-send-horizontal"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg>
        </button>
    </div>
  </main>

  <!-- ==================== SCRIPTS ==================== -->
  <!-- Orden de carga: Dependencias → Config → DOM → UI -->
  <!-- 1. Referencias del DOM (sin dependencias) -->
  <script type="module" src="js/script-basic.js"></script>
  <!-- 2. Configuración de Firebase Firestore (dependencia para UI) -->
  <script type="module" src="js/firebase-config.js"></script>
  <!-- Script de manejo de Logins -->
  <script type="module" src="js/login.js"></script>
  <!-- 3. UI principal (depende de script-basic.js y firebase-config.js) -->
  <script type="module" src="js/ui.js"></script>
  </body>
</html>
